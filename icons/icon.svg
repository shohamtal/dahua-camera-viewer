<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2836"/>
      <stop offset="1" stop-color="#0f1216"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea2ff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- CCTV bullet camera, tilted down -->
  <g transform="rotate(-18 64 64)">
    <!-- mount arm -->
    <rect x="30" y="40" width="10" height="34" rx="5" fill="#8a97a8"/>
    <rect x="26" y="70" width="18" height="8" rx="4" fill="#8a97a8"/>
    <!-- body -->
    <rect x="38" y="44" width="60" height="26" rx="13" fill="url(#cam)"/>
    <!-- lens -->
    <circle cx="92" cy="57" r="9" fill="#0f1216"/>
    <circle cx="92" cy="57" r="4.5" fill="#6ea2ff"/>
    <!-- sunshield -->
    <rect x="44" y="40" width="42" height="7" rx="3.5" fill="#3f6fd0"/>
  </g>
  <!-- live dot -->
  <circle cx="96" cy="94" r="8" fill="#ff5c5c"/>
</svg>
