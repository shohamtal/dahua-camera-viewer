<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dahua Camera Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen" class="login-body">
    <form id="login" class="card login-card" autocomplete="on">
      <h1 id="login-title">Dahua Camera Viewer</h1>
      <p class="sub">Connect directly to your NVR / DVR / camera</p>
      <div id="saved" class="hidden">
        <ul id="saved-list" class="saved-list"></ul>
        <h2 id="form-title" class="form-title">Add or edit an NVR</h2>
      </div>
      <label>Name <span class="muted">(optional)</span>
        <input name="name" placeholder="e.g. Building A" autocomplete="off" />
      </label>
      <label>IP address
        <input name="ip" placeholder="192.168.1.108" required />
      </label>
      <label>HTTP port
        <input name="port" value="80" inputmode="numeric" />
      </label>
      <label>Username
        <input name="user" placeholder="admin" required autocomplete="username" />
      </label>
      <label>Password
        <input name="pass" type="password" required autocomplete="current-password" />
      </label>
      <label class="check"><input type="checkbox" name="remember" checked /> Remember on this computer</label>
      <button type="submit" id="submit">Connect</button>
      <p id="login-msg" class="msg" role="status"></p>
    </form>
  </div>

  <!-- APP -->
  <div id="app-screen" class="hidden">
    <header class="topbar">
      <div class="brand"><select id="dev-switch" class="dev-switch" title="Switch NVR"></select><span id="device" class="muted"></span></div>
      <div class="spacer"></div>
      <div class="seg" role="tablist">
        <button class="seg-btn active" data-view="live" role="tab">Live</button>
        <button class="seg-btn" data-view="recordings" role="tab">Recordings</button>
        <button class="seg-btn" data-view="events" role="tab">Events</button>
        <button class="seg-btn" data-view="admin" role="tab">Admin</button>
      </div>
      <button id="logout" class="ghost">Sign out</button>
    </header>

    <main id="view-live" class="view">
      <div id="grid" class="grid"></div>
    </main>

    <!-- Fullscreen single-camera live -->
    <div id="modal" class="modal hidden">
      <div class="modal-inner">
        <div class="modal-head">
          <span id="modal-title"></span>
          <button id="modal-close" class="ghost">✕</button>
        </div>
        <div class="modal-video"><img id="modal-img" alt="" /><div id="modal-status" class="tile-status">Connecting…</div></div>
      </div>
    </div>

    <!-- Recording playback (WebCodecs) -->
    <div id="play-modal" class="modal hidden">
      <div class="modal-inner">
        <div class="modal-head">
          <span id="play-title"></span>
          <button id="play-close" class="ghost">✕</button>
        </div>
        <div class="modal-video"><canvas id="play-canvas"></canvas><div id="play-status" class="tile-status">Buffering…</div></div>
        <div class="play-controls">
          <button id="pb-back" title="Back 1 min">⏮</button>
          <button id="pb-toggle" title="Play/Pause">⏸</button>
          <button id="pb-fwd" title="Forward 1 min">⏭</button>
          <span id="pb-cur" class="pb-time">00:00:00</span>
          <input id="pb-seek" class="pb-seek" type="range" min="0" max="100" value="0" step="1" />
          <span id="pb-dur" class="pb-time">00:00:00</span>
        </div>
      </div>
    </div>

    <main id="view-recordings" class="view hidden">
      <div class="toolbar">
        <label class="inline">Camera <select id="rec-camera"></select></label>
        <label class="inline">Date <input id="rec-date" type="date" /></label>
        <button id="rec-search">Search</button>
        <span id="rec-status" class="muted"></span>
      </div>
      <ul id="rec-list" class="rec-list"></ul>
    </main>

    <main id="view-events" class="view hidden">
      <div class="toolbar">
        <label class="inline">Camera <select id="ev-camera"></select></label>
        <label class="inline">Date <input id="ev-date" type="date" /></label>
        <button id="ev-search">Search</button>
        <span id="ev-status" class="muted"></span>
      </div>
      <div id="ev-strips" class="ev-strips"></div>
      <ul id="ev-list" class="rec-list"></ul>
    </main>

    <main id="view-admin" class="view hidden">
      <nav id="admin-nav" class="subnav">
        <button data-sec="overview" class="active">Security</button>
        <button data-sec="users">Users</button>
        <button data-sec="log">Log</button>
        <button data-sec="streams">Streams</button>
        <button data-sec="clock">Clock</button>
      </nav>
      <section id="adm-overview" class="adm-sec"></section>
      <section id="adm-users" class="adm-sec hidden"></section>
      <section id="adm-log" class="adm-sec hidden"></section>
      <section id="adm-streams" class="adm-sec hidden"></section>
      <section id="adm-clock" class="adm-sec hidden"></section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
